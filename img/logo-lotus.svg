<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Opacidades e Gradientes para efeito translúcido das pétalas -->
    <linearGradient id="petalGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9F107C" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F45368" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="petalGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F45368" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#EF9ECD" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="petalGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9F107C" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#EF9ECD" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <g id="lotus-flower">
    <!-- Pétala Esquerda Inferior -->
    <path d="M 230 330 C 150 330 90 280 70 250 C 110 260 170 280 230 330 Z" fill="url(#petalGrad2)" />

    <!-- Pétala Esquerda Média -->
    <path d="M 240 335 C 130 310 110 210 135 150 C 160 210 200 280 240 335 Z" fill="url(#petalGrad1)" opacity="0.85" />

    <!-- Pétala Central / Traseira -->
    <path d="M 250 340 C 190 260 180 120 225 60 C 260 130 260 250 250 340 Z" fill="url(#petalGrad2)" opacity="0.9" />

    <!-- Pétala Direita Principal -->
    <path d="M 250 340 C 290 250 320 110 375 90 C 360 170 320 280 250 340 Z" fill="url(#petalGrad1)" />

    <!-- Pétala Direita Externa -->
    <path d="M 245 338 C 290 280 340 210 385 180 C 365 240 310 310 245 338 Z" fill="url(#petalGrad3)" />

    <!-- Sobreposição Núcleo Pétala Central -->
    <path d="M 245 340 C 210 300 200 230 220 180 C 240 230 250 290 245 340 Z" fill="#9F107C" opacity="0.6" />
  </g>
</svg>
